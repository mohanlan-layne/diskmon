# diskmon-client 配置
# 数据库连接 ──────────────────────────────────────────────────────
postgres:
  dsn: "yudao:Yudao@2025@tcp(192.168.1.190:3306)/diskmon?parseTime=true&charset=utf8mb4&loc=Local"

# 服务器标识 ──────────────────────────────────────────────────────
server_id: "wzl-e"
name: "wzl测试监听地址"
smb_user: "Administrator"

# 管理 API ────────────────────────────────────────────────────────
api:
  listen: ":19090"
  token:  ""

# 监控卷 ──────────────────────────────────────────────────────────
volumes:
  - name: "E:"
    journal_size: 134217728
    biz_rule: ""

# 过滤规则 ────────────────────────────────────────────────────────
filters:
  include_dirs:
    - 'E:\filecenter'
  exclude_dirs:
    - 'E:\filecenter\temp'
    - 'E:\filecenter\temp2'
  extensions:
    - '.txt'
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.pdf'
    - '.jpg'
    - '.png'
    - '.mp4'
    - '.mp3'
    - '.avi'
    - '.mkv'
    - '.wmv'
    - '.flv'
    - '.zip'
    - '.rar'
    - '.7z'
    - '.gz'
    - '.tar'
  events: []

# 其他参数 ────────────────────────────────────────────────────────
poll_interval_ms: 1000
rename_window_ms: 500
path_resolver_cache_size: 200000

checkpoint_path: 'D:\diskmon\checkpoints'
log_path:        'D:\diskmon\logs\client.log'
